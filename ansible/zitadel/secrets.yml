# The rest of the console's, chat's and Harbor's secrets, after setup.yml:
# generated ones (cookie and encryption keys, the hub's tokens), the chat's
# LiteLLM key, the console's Harbor admin token (inserted on the Harbor host),
# and values taken from the environment once and remembered (shared keys,
# OAuth clients). All of it goes into the state file; the private NixOS files
# are rendered from it:
#   private/<deployment>-cloud.nix   services.plan-ai-cloud.settings
#   private/<deployment>-chat.nix    services.plan-ai-chat.settings (+ hub)
#   private/<deployment>-harbor.nix  services.harbor-server.settings (with harbor_domain)
#
# A generated secret is made once; delete it from the state to rotate it.
#
#   ansible-playbook secrets.yml -e @deployments/<deployment>.yml
- hosts: localhost
  gather_facts: false
  vars:
    private: "{{ private_dir | default(playbook_dir ~ '/../../private') }}"
    state_file: "{{ private }}/{{ deployment }}-zitadel.json"
    # state key: how to make it when missing
    generated:
      console_encryption_key: "openssl rand -base64 32"
      console_cookie_secret: "openssl rand -hex 64"
      agent_cookie_secret: "openssl rand -hex 64"
      agent_connector_key: "openssl rand -base64 32"
      subnet_callback_secret: "openssl rand -hex 32"
      subnet_token: "openssl rand -hex 32"
      harbor_admin_token: "openssl rand -hex 32"
      harbor_encryption_key: "openssl rand -base64 32"
      harbor_cookie_secret: "openssl rand -hex 64"
    # state key: environment variable it is taken from (once; then remembered)
    remembered:
      litellm_master_key: LITELLM_MASTER_KEY
      registry_admin_token: REGISTRY_ADMIN_TOKEN
      internal_google_client_id: INTERNAL_GOOGLE_CLIENT_ID
      internal_google_client_secret: INTERNAL_GOOGLE_CLIENT_SECRET
      context7_api_key: CONTEXT7_API_KEY
      firecrawl_api_key: FIRECRAWL_API_KEY

  tasks:
    - name: Load the state (setup.yml makes it)
      ansible.builtin.set_fact:
        state: "{{ lookup('file', state_file) | from_json }}"

    - name: Check that setup.yml ran
      ansible.builtin.assert:
        that: [state.console_login is defined, state.agent_login is defined, state.console_api is defined, state.console_pat is defined]
        fail_msg: "{{ state_file }} lacks the Zitadel clients: run setup.yml first"

    - name: Generate what's missing
      ansible.builtin.set_fact:
        state: "{{ state | combine({item.key: lookup('pipe', item.value)}) }}"
      loop: "{{ generated | dict2items }}"
      when: not (state[item.key] | default(''))
      no_log: true

    - name: Remember what the environment gives
      ansible.builtin.set_fact:
        state: "{{ state | combine({item.key: lookup('env', item.value)}) }}"
      loop: "{{ remembered | dict2items }}"
      when: lookup('env', item.value) | length > 0
      no_log: true

    - ansible.builtin.include_tasks: tasks/save.yml

    - name: The console needs the shared LiteLLM master key and registry token
      ansible.builtin.assert:
        that: [state.litellm_master_key | default('') | length > 0, state.registry_admin_token | default('') | length > 0]
        fail_msg: "set LITELLM_MASTER_KEY and REGISTRY_ADMIN_TOKEN once (private/logos-cloud.nix has plan.ai's)"

    - name: The chat's LiteLLM key
      when: not (state.agent_litellm_key | default(''))
      ansible.builtin.uri:
        url: "{{ litellm_url }}/key/generate"
        method: POST
        headers:
          Authorization: "Bearer {{ state.litellm_master_key }}"
          User-Agent: nixos-infra-ansible/1
        body_format: json
        body: { key_alias: "{{ litellm_key_alias }}", metadata: { for: "{{ agent_domain }}" } }
      register: llm
      changed_when: true
      no_log: true

    - ansible.builtin.set_fact:
        state: "{{ state | combine({'agent_litellm_key': llm.json.key}) }}"
      when: llm is not skipped
      no_log: true

    - ansible.builtin.include_tasks: tasks/save.yml

    # Harbor keeps sha256(token); a second insert of the same hash is a no-op.
    - name: The console's admin token on Harbor
      when: harbor_domain | default('') | length > 0 and harbor_ssh | default('') | length > 0
      ansible.builtin.command:
        argv:
          - ssh
          - "{{ harbor_ssh }}"
          - >-
            runuser -u postgres -- psql -X -q -At {{ harbor_database }} -c
            "INSERT INTO tokens (token_hash, label, kind) VALUES
            ('{{ state.harbor_admin_token | hash('sha256') }}', '{{ console_domain }} console', 'admin')
            ON CONFLICT (token_hash) DO NOTHING RETURNING 'inserted'"
      register: harbor_token
      changed_when: "'inserted' in harbor_token.stdout"
      no_log: true

    - name: Render the private NixOS files
      ansible.builtin.template:
        src: "templates/{{ item }}.nix.j2"
        dest: "{{ private }}/{{ deployment }}-{{ item }}.nix"
        mode: "0600"
      loop: "{{ ['cloud', 'chat'] + (['harbor'] if harbor_domain | default('') else []) }}"
      no_log: true
